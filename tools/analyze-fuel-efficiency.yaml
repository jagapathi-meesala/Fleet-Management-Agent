name: analyze-fuel-efficiency
description: Compute standard fuel-efficiency metrics for a vehicle trip.
version: 1.0.0
input_schema:
  type: object
  properties:
    vehicle_id: {type: string}
    distance_km: {type: number}
    fuel_litres: {type: number}
  required: [vehicle_id, distance_km, fuel_litres]
output_schema:
  type: object
  properties:
    vehicle_id: {type: string}
    distance_km: {type: number}
    fuel_litres: {type: number}
    litres_per_100km: {type: number}
    km_per_litre: {type: number}
implementation:
  type: script
  path: analyze-fuel-efficiency.py
  runtime: python3
  timeout: 30
annotations:
  requires_confirmation: false
  read_only: true
  cost: low
